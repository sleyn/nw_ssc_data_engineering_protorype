[project]
name = "nw-ssc-data-engineering-protorype"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "cryptography>=50.0.1",
    "matplotlib>=3.11.1",
    "pandas>=3.0.5",
    "plotly>=7.0.0",
    "seaborn>=0.13.2",
    "streamlit>=1.63.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "mypy>=2.3.1",
    "nbconvert>=7.17.1",
    "pandas-stubs>=3.0.5.260730",
    "pytest>=9.1.1",
    "ruff>=0.16.6",
    "types-seaborn>=0.13.2.20260728",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true

# plotly ships no py.typed marker and no maintained stub package exists
# (unlike matplotlib/seaborn/pandas above) -- silence the import-untyped
# noise rather than sprinkling per-call type: ignore comments.
[[tool.mypy.overrides]]
module = ["plotly.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
